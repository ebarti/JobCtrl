<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobCtrl</title>
    <script type="module" src="/src/popup.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <h1>JobCtrl</h1>
        <span id="api-state" class="status-pill">Checking</span>
      </header>
      <section>
        <label for="token-input">Pairing token</label>
        <div class="token-row">
          <input id="token-input" type="password" autocomplete="off" />
          <button id="save-token" type="button">Save</button>
        </div>
        <button id="select-discovery" type="button" hidden>Use this Chrome profile for Discovery</button>
      </section>
      <section class="action-row">
        <button id="capture" class="primary" type="button">Save job</button>
        <button id="autofill" type="button">Review autofill</button>
        <button id="retry-queue" type="button">Sync queued captures</button>
        <button id="review-queue" type="button">Review queued captures</button>
        <button id="clear-queue" type="button">Clear queue</button>
      </section>
      <section id="queue-review" hidden>
        <label for="queue-selection">Queued capture</label>
        <select id="queue-selection"><option value="">Select a capture</option></select>
        <p id="queue-state"></p>
        <p id="queue-url"></p>
        <label for="queue-content">Saved content</label>
        <textarea id="queue-content" readonly rows="5"></textarea>
        <p id="queue-note"></p>
        <p>Discarding removes only the local copy and cannot recall a send in progress.</p>
        <button id="discard-queued" type="button" disabled>Discard selected capture</button>
      </section>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
