schema_version = 1

# One real behavioral suite, plus static/build checks. The runner owns fresh
# state and reports its evidence path and setup/total timing on stdout.
[checks.diff]
kind = "static"
description = "Candidate changes contain no whitespace errors or conflict markers"
argv = ["git", "diff", "--check"]

[checks.types-and-architecture]
kind = "static"
description = "Production source types, feature boundaries, Python lint and native vet"
argv = ["corepack", "pnpm", "check"]
timeout_seconds = 600

[checks.docs]
kind = "static"
description = "Published documentation and internal links build"
argv = ["corepack", "pnpm", "docs:build"]
timeout_seconds = 300

[checks.distribution]
kind = "static"
description = "Locked payload manifests and installable components satisfy distribution policy"
argv = ["corepack", "pnpm", "distribution:audit"]
timeout_seconds = 300

[checks.e2e]
kind = "command"
description = "Real browser/Python API/domain/SQLite/files/Temporal/worker/renderer journeys"
argv = ["corepack", "pnpm", "e2e"]
timeout_seconds = 600
