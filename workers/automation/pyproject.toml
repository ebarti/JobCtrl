[project]
name = "jobhunter"
version = "0.3.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "ebarti"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "websocket-client>=1.8",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "temporalio>=1.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "python-jobspy>=1.1.82",
    # Pydantic backs the canonical employer-analysis domain model
    # (``domain/materials/analysis.py``) and is also pulled transitively by
    # the agent SDKs below. Declared explicitly because the domain layer
    # imports it directly.
    "pydantic>=2.10",
    # Phase 1 employer-analysis ensemble (D-01/D-03): the analysis call runs
    # through agent SDKs, never raw model APIs. Adapters lazy-import these so
    # the package stays importable (and the test suite mocks the SDK boundary)
    # even when the optional CLIs are absent. Pinned to the resolvable set
    # within the workspace dependency cutoff. The Codex beta pin selects
    # openai-codex-cli-bin 0.137.0a4, the first audited runtime here with
    # manylinux wheels for standard glibc Linux.
    "claude-agent-sdk==0.2.87",
    "openai-codex==0.1.0b3",
    "openai-codex-cli-bin==0.137.0a4",
    # Antigravity (Gemini) ensemble leg (D-03) — the 3rd, Google-diverse leg.
    # Mirrors the working reference in ~/Github/mestre. Published after the
    # workspace cutoff, so a per-package override is set in [tool.uv] below.
    "google-antigravity==0.1.2",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "pytest-asyncio>=0.23", "pytest-randomly>=4.0", "ruff>=0.1"]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[project.urls]
Homepage = "https://github.com/ebarti/JobHunter"
Repository = "https://github.com/ebarti/JobHunter"
Issues = "https://github.com/ebarti/JobHunter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.hatch.build]
artifacts = ["src/jobhunter/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.uv]
# python-jobspy 1.1.82 still caps markdownify below the patched 0.14.1
# release. Keep this override until upstream loosens its dependency metadata.
override-dependencies = ["markdownify==0.14.1"]

# The workspace dependency cutoff (UV_EXCLUDE_NEWER) blocks google-antigravity
# 0.1.2 (published 2026-06-04). The Antigravity (Gemini) ensemble leg needs it;
# this per-package override (mirroring ~/Github/mestre) lets just this package
# past the cutoff without moving the global cutoff for everything else.
exclude-newer-package = { "google-antigravity" = "2026-06-04T21:19:27Z" }
