[project]
name = "jobctrl"
version = "0.1.1"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Eloi Barti" }]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "certifi>=2024.2.2",
    "typer>=0.9.0",
    "click>=8.3.3",
    "rich>=13.0",
    "httpx>=0.24",
    "websocket-client>=1.8",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "pyyaml>=6.0",
    "pandas>=2.0",
    # Floor provides activity.cancellation_details() and Info.activity_run_id,
    # which the enrichment/discovery ownership fencing reads.
    "temporalio>=1.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # Typed, concurrent job-board events plus resumable checkpoints. Pin the
    # integration contract so JobCtrl's durable adapter changes deliberately.
    "jobstreaming==0.0.5",
    # Pydantic backs the canonical employer-analysis domain model
    # (``domain/materials/analysis.py``) and is also pulled transitively by
    # the agent SDKs below. Declared explicitly because the domain layer
    # imports it directly.
    "pydantic>=2.10",
    # Gmail verification scopes derive sender domains from application URLs and
    # need public-suffix-aware eTLD+1 parsing.
    "publicsuffix2>=2.20191221,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cryptography>=43.0",
    "google-auth>=2.0",
    "hatchling==1.29.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=4.0",
    "pytest-timeout>=2.4,<3",
    "ruff==0.15.8",
]
providers = [
    "claude-agent-sdk==0.2.115",
    "mcp>=1.28.1",
    "openai-codex==0.144.4",
    "openai-codex-cli-bin==0.144.4",
    "google-antigravity==0.1.2",
    "pyasn1>=0.6.4",
]

# Source checkouts keep the provider ensemble available on ordinary `uv sync`
# and `uv run`. Production payload builders use `--no-default-groups --no-dev`
# and acquire provider wheels separately through the signed provider-pack path.
[dependency-groups]
provider-runtime = [
    "claude-agent-sdk==0.2.115",
    "openai-codex==0.144.4",
    "openai-codex-cli-bin==0.144.4",
    "google-antigravity==0.1.2",
]
release-build = ["build==1.4.3", "hatchling==1.29.0"]
# The always-on privacy gate uses only this locked tool slice; it must not
# resolve an independent floating pytest environment on every pull request.
release-check = ["pytest>=7.0"]

[project.scripts]
jobctrl = "jobctrl.cli:app"

[project.urls]
Homepage = "https://github.com/ebarti/JobCtrl"
Repository = "https://github.com/ebarti/JobCtrl"
Issues = "https://github.com/ebarti/JobCtrl/issues"

[build-system]
# Release builds run with --no-isolation, so both the build backend and the
# locked development environment must resolve this exact, audited backend.
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobctrl"]

[tool.hatch.build]
artifacts = ["src/jobctrl/config/*.yaml", "src/jobctrl/assets/fonts/*", "src/jobctrl/infrastructure/migrations/*.sql"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "strict"
# "thread" dumps every thread's stack at the bound and hard-exits the process.
# "signal" raised only in the main thread and could not unwind a worker-pool
# thread blocked in a SQLite BEGIN IMMEDIATE wait, which wedged the lane for
# its whole job ceiling (run 32481181792, Python 3.11). faulthandler stays as
# the slightly later second-chance dump if pytest-timeout itself fails.
faulthandler_timeout = 240
timeout = 180
timeout_method = "thread"
markers = [
    "core: hermetic tests that do not own a Temporal test server or migration fixture",
    "migration: database migration and copy tests routed to memory-backed CI storage",
    "system_browser: opt-in smoke requiring a real local system Chrome/Chromium; set JOBCTRL_RUN_SYSTEM_BROWSER_TESTS=1",
    "temporal: tests whose file owns a Temporal WorkflowEnvironment lifecycle",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.uv]
default-groups = ["provider-runtime"]

# Dependabot owns the rolling community-vetting delay. Keeping that delay here
# as a relative timestamp would make an unchanged lockfile fail `uv --locked`
# as time passes. Provider runtimes and the audited JobStreaming integration
# retain their explicit reviewed cutoffs.
exclude-newer-package = { "google-antigravity" = "2026-06-04T21:19:27Z", "claude-agent-sdk" = "2026-07-10T00:00:00Z", "jobstreaming" = "2026-08-29T23:59:59Z" }
