[project]
name = "jobctrl"
version = "2.0.4"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Eloi Barti" }]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "websocket-client>=1.8",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "temporalio>=1.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # Typed, concurrent job-board events plus resumable checkpoints. Pin the
    # integration contract so JobCtrl's durable adapter changes deliberately.
    "jobstreaming==0.0.2",
    # Pydantic backs the canonical employer-analysis domain model
    # (``domain/materials/analysis.py``) and is also pulled transitively by
    # the agent SDKs below. Declared explicitly because the domain layer
    # imports it directly.
    "pydantic>=2.10",
    # Gmail verification scopes derive sender domains from application URLs and
    # need public-suffix-aware eTLD+1 parsing.
    "publicsuffix2>=2.20191221,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cryptography>=43.0",
    "google-auth>=2.0",
    "hatchling==1.29.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=4.0",
    "ruff>=0.1",
]
providers = [
    "claude-agent-sdk==0.2.115",
    "openai-codex==0.1.0b3",
    "openai-codex-cli-bin==0.137.0a4",
    "google-antigravity==0.1.2",
]

# Source checkouts keep the provider ensemble available on ordinary `uv sync`
# and `uv run`. Production payload builders use `--no-default-groups --no-dev`
# and acquire provider wheels separately through the signed provider-pack path.
[dependency-groups]
provider-runtime = [
    "claude-agent-sdk==0.2.115",
    "openai-codex==0.1.0b3",
    "openai-codex-cli-bin==0.137.0a4",
    "google-antigravity==0.1.2",
]
release-build = ["build==1.4.3", "hatchling==1.29.0"]

[project.scripts]
jobctrl = "jobctrl.cli:app"

[project.urls]
Homepage = "https://github.com/ebarti/JobCtrl"
Repository = "https://github.com/ebarti/JobCtrl"
Issues = "https://github.com/ebarti/JobCtrl/issues"

[build-system]
# Release builds run with --no-isolation, so both the build backend and the
# locked development environment must resolve this exact, audited backend.
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobctrl"]

[tool.hatch.build]
artifacts = ["src/jobctrl/config/*.yaml", "src/jobctrl/assets/fonts/*"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "system_browser: opt-in smoke requiring a real local system Chrome/Chromium; set JOBCTRL_RUN_SYSTEM_BROWSER_TESTS=1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.uv]
default-groups = ["provider-runtime"]

# The workspace dependency cutoff intentionally freezes the broad dependency
# graph. Keep it as a fixed project value, rather than a caller-provided
# relative `UV_EXCLUDE_NEWER` value, so locked source runtimes and release
# workflows resolve against the same graph. Provider runtimes and the audited
# JobStreaming integration move independently, so admit only their reviewed
# releases without moving the global cutoff for everything else.
exclude-newer = "2026-07-09T19:15:43.240437Z"
exclude-newer-package = { "google-antigravity" = "2026-06-04T21:19:27Z", "claude-agent-sdk" = "2026-07-10T00:00:00Z", "jobstreaming" = "2026-07-18T00:00:00Z" }
