[project]
name = "jobctrl"
version = "2.0.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "ebarti"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "websocket-client>=1.8",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "temporalio>=1.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "python-jobspy>=1.1.82",
    # Pydantic backs the canonical employer-analysis domain model
    # (``domain/materials/analysis.py``) and is also pulled transitively by
    # the agent SDKs below. Declared explicitly because the domain layer
    # imports it directly.
    "pydantic>=2.10",
    # Gmail verification scopes derive sender domains from application URLs and
    # need public-suffix-aware eTLD+1 parsing.
    "publicsuffix2>=2.20191221,<3",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "pytest-asyncio>=0.23", "pytest-randomly>=4.0", "ruff>=0.1"]
providers = [
    "claude-agent-sdk==0.2.87",
    "openai-codex==0.1.0b3",
    "openai-codex-cli-bin==0.137.0a4",
    "google-antigravity==0.1.2",
]

# Source checkouts keep the provider ensemble available on ordinary `uv sync`
# and `uv run`. Production payload builders use `--no-default-groups --no-dev`
# and acquire provider wheels separately through the signed provider-pack path.
[dependency-groups]
provider-runtime = [
    "claude-agent-sdk==0.2.87",
    "openai-codex==0.1.0b3",
    "openai-codex-cli-bin==0.137.0a4",
    "google-antigravity==0.1.2",
]

[project.scripts]
jobctrl = "jobctrl.cli:app"

[project.urls]
Homepage = "https://github.com/ebarti/JobCtrl"
Repository = "https://github.com/ebarti/JobCtrl"
Issues = "https://github.com/ebarti/JobCtrl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobctrl"]

[tool.hatch.build]
artifacts = ["src/jobctrl/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.uv]
default-groups = ["provider-runtime"]
# python-jobspy 1.1.82 still caps markdownify below the patched 0.14.1
# release. Keep this override until upstream loosens its dependency metadata.
override-dependencies = ["markdownify==0.14.1"]

# The workspace dependency cutoff (UV_EXCLUDE_NEWER) blocks google-antigravity
# 0.1.2 (published 2026-06-04). The Antigravity (Gemini) ensemble leg needs it;
# this per-package override (mirroring ~/Github/mestre) lets just this package
# past the cutoff without moving the global cutoff for everything else.
exclude-newer-package = { "google-antigravity" = "2026-06-04T21:19:27Z" }
