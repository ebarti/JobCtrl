[project]
name = "jobhunter"
version = "0.3.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "ebarti"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "temporalio>=1.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    ]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.1"]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[project.urls]
Homepage = "https://github.com/ebarti/JobHunter"
Repository = "https://github.com/ebarti/JobHunter"
Issues = "https://github.com/ebarti/JobHunter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.hatch.build]
artifacts = ["src/jobhunter/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.11"
