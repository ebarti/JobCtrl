version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packaging/distribution/api-native"
      - "/packaging/distribution/playwright-mcp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/workers/automation"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/launcher"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
