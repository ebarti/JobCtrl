version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packaging/distribution/api-native"
      - "/packaging/distribution/playwright-mcp"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      web-test-tooling:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "msw"
          - "msw-storybook-addon"
        update-types:
          - "minor"
          - "patch"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/workers/automation"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # Match the manifest's reviewed cutoffs. Type-only ignores preserve
    # security update attempts; cutoff and lock maintenance stays explicit.
    ignore:
      - dependency-name: "claude-agent-sdk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "google-antigravity"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "jobstreaming"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
        update-types:
          - "minor"
          - "patch"
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/launcher"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "04:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "04:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    # Dependabot rejects semver-granular cooldowns for github-actions
    # (actions resolve as refs, not semver packages); only a general
    # cooldown is supported here.
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
