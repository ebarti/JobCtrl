name: Frontend verification
'on':
  workflow_call:
    inputs:
      web:
        type: boolean
        default: true
      storybook:
        type: boolean
        default: true
      e2e:
        type: boolean
        default: true
      extension:
        type: boolean
        default: true
      docs:
        type: boolean
        default: true
      demo:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checks:
    name: UI checks
    if: "${{ inputs.web || inputs.storybook || inputs.e2e || inputs.extension || inputs.docs
      || inputs.demo }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: '3.12'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
        cache: pnpm
    - name: Record the hosted frontend resource budget
      env:
        CI_PROFILE: "${{ inputs.e2e && 'browser' || inputs.web && 'web' || 'support'
          }}"
      run: |
        node --input-type=module <<'NODE'
        import os from 'node:os';
        console.log(JSON.stringify({profile: process.env.CI_PROFILE, cpuCount: os.availableParallelism(), totalMemoryMiB: Math.round(os.totalmem() / 1024 / 1024)}));
        NODE
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
      if: "${{ inputs.e2e }}"
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.11.7
        enable-cache: true
        cache-dependency-glob: workers/automation/uv.lock
      if: "${{ inputs.e2e }}"
    - name: Install frozen Node dependencies once
      id: dependencies
      run: corepack pnpm install --frozen-lockfile
    - name: Sync locked Python dependencies for real RPC and PDF checks
      if: "${{ inputs.e2e }}"
      run: uv --project workers/automation sync --locked --all-extras
    - name: Bound hosted Ubuntu package transport
      run: bash scripts/ci-apt-timeouts.sh
      if: "${{ inputs.storybook || inputs.e2e || inputs.extension || inputs.docs }}"
    - name: Install shared pinned Node Chromium and its system dependencies
      timeout-minutes: 8
      run: corepack pnpm --filter @jobctrl/web exec playwright install --with-deps
        chromium
      if: "${{ inputs.storybook || inputs.e2e || inputs.extension || inputs.docs }}"
    - name: Install the separate locked Python Chromium
      timeout-minutes: 8
      if: "${{ inputs.e2e }}"
      run: uv --project workers/automation run --locked --all-extras playwright install
        chromium
    - name: Prepare PDF measurement tools
      timeout-minutes: 8
      run: |
        sudo apt-get update
        sudo apt-get install --yes poppler-utils
        corepack pnpm --filter @jobctrl/web e2e:check-pdf-tools
      if: "${{ inputs.e2e }}"
    - name: Run the selected frontend profile
      if: "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
      timeout-minutes: 35
      env:
        CI_WEB: "${{ inputs.web }}"
        CI_STORYBOOK: "${{ inputs.storybook }}"
        CI_E2E: "${{ inputs.e2e }}"
        CI_EXTENSION: "${{ inputs.extension }}"
        CI_DOCS: "${{ inputs.docs }}"
        CI_DEMO: "${{ inputs.demo }}"
      run: node scripts/ci-frontend.mjs
    - name: Upload synthetic first-connection screenshots
      if: "${{ always() && inputs.e2e }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: synthetic-first-connection-screenshots
        path: |
          ${{ runner.temp }}/e2e-isolated.xml.artifacts/**/first-open-*.png
          ${{ runner.temp }}/e2e-real-rpc.xml.artifacts/**/first-open-*.png
        if-no-files-found: ignore
    - name: Upload synthetic E2E JUnit reports
      if: "${{ always() && inputs.e2e }}"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: e2e-junit-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/e2e-isolated.xml
          ${{ runner.temp }}/e2e-real-rpc.xml
        retention-days: 7
        if-no-files-found: warn
    - name: Upload site artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: docs-site-dist
        path: docs/.vitepress/dist
        retention-days: 7
      if: "${{ success() && inputs.docs }}"
    - name: Upload demo artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: demo-site-dist
        path: dist/web
        retention-days: 7
      if: "${{ success() && inputs.demo }}"
    - name: Retain frontend profile logs and outcomes
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: frontend-lanes-${{ inputs.e2e && 'browser' || inputs.web && 'web' ||
          'support' }}-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ci-frontend-logs"
        retention-days: 7
        if-no-files-found: warn
