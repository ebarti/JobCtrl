name: Demo Edge CI

on:
  pull_request:
    paths:
      - "apps/demo-edge/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/demo-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: Demo edge checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify edge workers
        run: corepack pnpm demo-edge:check && corepack pnpm demo-edge:test && corepack pnpm demo-edge:dry-run
