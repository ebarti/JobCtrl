name: Release shell compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/release-distribution.yml"
      - ".github/workflows/release-shell-compat.yml"
      - "scripts/release-distribution-workflow.test.mjs"
      - "scripts/release-resume-pypi.sh"
      - "scripts/release-resume-pypi.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-shell-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  system-bash:
    name: Release gates on macOS system Bash
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - name: Test release lineage and recovery gates
        run: node --test scripts/release-resume-pypi.test.mjs scripts/release-distribution-workflow.test.mjs
