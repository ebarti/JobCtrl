name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - edited
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  admission:
    name: Admission
    uses: "./.github/workflows/ci-admission.yml"
  backend:
    name: Backend
    needs: admission
    uses: "./.github/workflows/ci-backend.yml"
    with:
      api: "${{ needs.admission.outputs.api != 'false' }}"
      python: "${{ needs.admission.outputs.python != 'false' }}"
      head_privacy: "${{ needs.admission.outputs.head_privacy != 'false' }}"
      distribution: "${{ needs.admission.outputs.distribution != 'false' }}"
      edge: "${{ needs.admission.outputs.edge != 'false' }}"
  frontend:
    name: Frontend
    needs: admission
    uses: "./.github/workflows/ci-frontend.yml"
    with:
      web: "${{ needs.admission.outputs.web != 'false' }}"
      storybook: "${{ needs.admission.outputs.storybook != 'false' }}"
      e2e: false
      extension: "${{ needs.admission.outputs.extension != 'false' }}"
      docs: "${{ needs.admission.outputs.docs != 'false' }}"
      demo: "${{ needs.admission.outputs.demo != 'false' }}"
  browser:
    name: Browser
    needs: admission
    uses: "./.github/workflows/ci-frontend.yml"
    with:
      web: false
      storybook: false
      e2e: "${{ needs.admission.outputs.e2e != 'false' }}"
      extension: false
      docs: false
      demo: false
  native:
    name: Native
    needs: admission
    uses: "./.github/workflows/launcher.yml"
    with:
      enabled: "${{ needs.admission.outputs.launcher != 'false' }}"
  credentials:
    name: Credentials
    needs: admission
    uses: "./.github/workflows/native-credentials.yml"
    with:
      enabled: "${{ needs.admission.outputs.credentials != 'false' }}"
  gmail:
    name: Gmail
    needs: admission
    uses: "./.github/workflows/gmail-token-windows.yml"
    with:
      enabled: "${{ needs.admission.outputs.gmail != 'false' }}"
  preview:
    name: Deploy static preview
    needs:
    - admission
    - frontend
    if: needs.admission.outputs.preview == 'true' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository && vars.DEMO_PREVIEW_DEPLOY_ENABLED
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
    - name: Download demo artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: demo-site-dist
        path: dist/web
    - name: Publish static preview
      run: corepack pnpm dlx wrangler@4.107.0 pages deploy dist/web --project-name=jobctrl-demo
        --branch="$HEAD_REF"
      env:
        HEAD_REF: "${{ github.head_ref }}"
        CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
