name: CI
'on':
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    name: Admission
    uses: ./.github/workflows/ci-admission.yml
  backend:
    name: Backend
    needs: admission
    uses: ./.github/workflows/ci-static.yml
    with:
      surface: backend
  frontend:
    name: Frontend
    needs: admission
    uses: ./.github/workflows/ci-static.yml
    with:
      surface: frontend
  support:
    name: Support
    needs: admission
    uses: ./.github/workflows/ci-static.yml
    with:
      surface: support
  browser:
    name: Browser
    needs: admission
    uses: ./.github/workflows/ci-e2e.yml
  native:
    name: Native
    needs: admission
    uses: ./.github/workflows/launcher.yml
  credentials:
    name: Credentials
    needs: admission
    uses: ./.github/workflows/native-credentials.yml
  gmail:
    name: Gmail
    needs: admission
    uses: ./.github/workflows/gmail-token-windows.yml
