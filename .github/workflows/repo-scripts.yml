name: Repo Scripts

# scripts/*.test.mjs asserts contracts across inputs that sprawl the whole
# repository: docs launch copy against README/ROADMAP/LAUNCH_CHECKLIST and
# .env.example, version parity into launcher.go and the release workflows,
# demo composition and headers, and the dev supervisor lifecycle. The suite is
# small and fast, so it runs on every pull request instead of maintaining a
# path map of everything it reads.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scripts:
    name: Script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Test repository scripts
        run: corepack pnpm scripts:test
