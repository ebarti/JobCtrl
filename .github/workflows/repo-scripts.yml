---
name: Repo Scripts
permissions:
  contents: read
concurrency:
  group: repo-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"
jobs:
  scripts:
    name: Script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
        cache: pnpm
    - name: Install locked dependencies
      id: dependencies
      run: corepack pnpm install --frozen-lockfile
    - name: Test repository scripts
      timeout-minutes: 10
      run: corepack pnpm scripts:test
  source-lifecycle-macos:
    name: Source supervisor lifecycle (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
    - name: Set up source lifecycle Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.4
    - name: Test the complete source lifecycle in an owned offline workspace
      shell: bash
      run: |
        set -euo pipefail
        node=$(command -v node)
        python=$(command -v python3)
        qa=$(mktemp -d "$RUNNER_TEMP/jobctrl-source-lifecycle.XXXXXX")
        qa=$(cd "$qa" && pwd -P)
        mkdir -p "$qa/home" "$qa/tmp" "$qa/bin"
        # The fixture supplies every service CLI. Only Python's stdlib is needed.
        printf '#!/bin/bash\nexec %q -I -S -B -W error::SyntaxWarning "$@"\n' "$python" > "$qa/bin/python3"
        chmod 700 "$qa/bin/python3"
        cat > "$qa/offline.sb" <<EOF
        (version 1)
        (allow default)
        (deny network-outbound (remote ip))
        (deny network-inbound (local ip))
        (deny file-write*)
        (allow file-write* (subpath "$qa"))
        (allow file-write-data (literal "/dev/null"))
        (deny mach-lookup (global-name "com.apple.securityd") (global-name "com.apple.securityd.xpc") (global-name "com.apple.SecurityServer"))
        (deny file-read* (subpath "$HOME/Library/Keychains") (subpath "/Library/Keychains") (subpath "/System/Library/Keychains"))
        (deny process-exec (literal "/usr/bin/security") (literal "/usr/bin/open") (subpath "/Applications"))
        EOF
        # Permit owned Unix control sockets, but no IP traffic or inherited keys.
        env -i HOME="$qa/home" TMPDIR="$qa/tmp" PATH="$qa/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 \
          /usr/bin/sandbox-exec -f "$qa/offline.sb" \
          "$node" --test --test-concurrency=1 --test-reporter=tap \
          scripts/dev-lifecycle.test.mjs | tee "$qa/lifecycle.tap"
        grep -Eq '^# tests [1-9][0-9]*$' "$qa/lifecycle.tap"
        grep -Fx '# fail 0' "$qa/lifecycle.tap"
        grep -Fx '# cancelled 0' "$qa/lifecycle.tap"
        grep -Fx '# skipped 0' "$qa/lifecycle.tap"
        grep -Fx '# todo 0' "$qa/lifecycle.tap"
'on':
  workflow_dispatch: 
