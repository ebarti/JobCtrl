name: Repo Scripts

# scripts/*.test.mjs asserts contracts across inputs that sprawl the whole
# repository: docs launch copy against README/ROADMAP and
# .env.example, version parity into launcher.go and the release workflows,
# demo composition and headers, and the dev supervisor lifecycle. The suite is
# small and fast. PR execution lives in pr-ci.yml; main/manual execution stays
# here instead of maintaining a path map of everything the contracts read.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scripts:
    name: Script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        id: dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Test repository scripts
        timeout-minutes: 10
        run: corepack pnpm scripts:test
