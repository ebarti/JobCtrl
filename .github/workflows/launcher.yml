        const input = lock.inputs.find((entry) => entry.id === 'temporal-runtime-archive');
        if (lock.platform !== `${process.platform}-${process.arch}` || !input) throw new Error('No locked Temporal runtime for this runner');
        const response = await fetch(input.url);
        if (!response.ok) throw new Error(`Temporal download failed: ${response.status}`);
        const archive = Buffer.from(await response.arrayBuffer());
        if (createHash('sha256').update(archive).digest('hex') !== input.sha256) throw new Error('Temporal archive digest mismatch');
        await writeFile(path.join(process.env.RUNNER_TEMP, 'jobctrl-temporal.tar.gz'), archive);
        NODE
        mkdir -p "$RUNNER_TEMP/jobctrl-temporal"
        tar -xOf "$RUNNER_TEMP/jobctrl-temporal.tar.gz" temporal > "$RUNNER_TEMP/jobctrl-temporal/temporal"
        chmod 700 "$RUNNER_TEMP/jobctrl-temporal/temporal"
        echo "JOBCTRL_TEMPORAL_CLI_PATH=$RUNNER_TEMP/jobctrl-temporal/temporal" >> "$GITHUB_ENV"
    - name: Install locked TypeScript migration probe
      run: corepack pnpm install --frozen-lockfile
    - name: Bind the migration integration Node runtime
      shell: bash
      run: |
        set -euo pipefail
        echo "JOBCTRL_MIGRATION_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
    - name: Test native fixture publication
      if: "${{ env.TEST_SHARD == '0' }}"
      working-directory: workers/automation
      run: '"$JOBCTRL_MIGRATION_TEST_PYTHON" -m unittest tests.test_native_apply_readiness

'
    - name: Vet native launcher
      if: "${{ env.TEST_SHARD == '0' }}"
      working-directory: launcher
      run: go vet ./...
    - name: Test native launcher shard
      working-directory: launcher
