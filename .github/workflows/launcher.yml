name: Native lifecycle qualification
'on':
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Darwin launcher shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            suite: lifecycle
          - shard: 1
            suite: custody
          - shard: 2
            suite: reduced
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.14.4'
      UV_LOCKED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.4
          cache-dependency-path: launcher/go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Prepare locked dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          uv python install 3.14.4
          uv --project workers/automation sync --locked --all-extras --python 3.14.4 --managed-python
      - name: Build the verified PostgreSQL runtime
        run: bash scripts/install-postgres-runtime.sh "$RUNNER_TEMP/postgres"
      - name: Exercise installed PostgreSQL migration, rollback, receipts and process cleanup
        run: node scripts/qa/native-lifecycle-e2e.mjs --python "$PWD/workers/automation/.venv/bin/python" --postgres-bin "$RUNNER_TEMP/postgres/bin" --output-parent "$RUNNER_TEMP" --suite "${{ matrix.suite }}"
      - name: Require unchanged dependency locks
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml workers/automation/uv.lock
      - name: Retain synthetic native qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lifecycle-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jobctrl-native-lifecycle-*/result.json
          retention-days: 7
          if-no-files-found: warn
