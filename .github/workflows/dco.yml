name: DCO

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    # Exempt repository-owner PRs by GitHub actor so the workflow does not
    # publish maintainer email addresses in configuration.
    if: ${{ github.event.pull_request.user.login != github.repository_owner }}
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check commit sign-offs
        uses: KineticCafe/actions-dco@e9627100b7f566546e67cde54bfa7d3790ab649b # v4.0.0
        with:
          config: |
            [bot]
            policy = "none"
