      - name: Install Playwright Chromium
        run: corepack pnpm --filter @jobctrl/web exec playwright install --with-deps chromium

      - name: Check rendered docs site
        run: corepack pnpm docs:check:runtime

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist
          retention-days: 7

  launcher0:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.launcher != 'false' }}
    name: Darwin launcher shard 0
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TEST_SHARD: "0"
    steps: &launcher-ci-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: launcher/go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Set up migration integration Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Sync the locked native integration runtime
        shell: bash
        run: |
          set -euo pipefail
          # Native Apply fixtures reuse pytest-decorated seeds and controlled ports.
          uv --project workers/automation sync --locked --no-default-groups --group release-check
          echo "JOBCTRL_MIGRATION_TEST_PYTHON=$GITHUB_WORKSPACE/workers/automation/.venv/bin/python3" >> "$GITHUB_ENV"
      - name: Install the verified Temporal integration runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const lock = JSON.parse(await readFile('packaging/distribution/components.lock.json', 'utf8'));
          const input = lock.inputs.find((entry) => entry.id === 'temporal-runtime-archive');
          if (lock.platform !== `${process.platform}-${process.arch}` || !input) throw new Error('No locked Temporal runtime for this runner');
          const response = await fetch(input.url);
          if (!response.ok) throw new Error(`Temporal download failed: ${response.status}`);
          const archive = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(archive).digest('hex') !== input.sha256) throw new Error('Temporal archive digest mismatch');
          await writeFile(path.join(process.env.RUNNER_TEMP, 'jobctrl-temporal.tar.gz'), archive);
          NODE
          mkdir -p "$RUNNER_TEMP/jobctrl-temporal"
          tar -xOf "$RUNNER_TEMP/jobctrl-temporal.tar.gz" temporal > "$RUNNER_TEMP/jobctrl-temporal/temporal"
          chmod 700 "$RUNNER_TEMP/jobctrl-temporal/temporal"
          echo "JOBCTRL_TEMPORAL_CLI_PATH=$RUNNER_TEMP/jobctrl-temporal/temporal" >> "$GITHUB_ENV"
      - name: Install locked TypeScript migration probe
        run: corepack pnpm install --frozen-lockfile
      - name: Bind the migration integration Node runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "JOBCTRL_MIGRATION_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Test native fixture publication
        if: ${{ env.TEST_SHARD == '0' }}
        working-directory: workers/automation
        run: |
          "$JOBCTRL_MIGRATION_TEST_PYTHON" -m unittest tests.test_native_apply_readiness
      - name: Vet native launcher
        if: ${{ env.TEST_SHARD == '0' }}
        working-directory: launcher
        run: go vet ./...
      - name: Test native launcher shard
        working-directory: launcher
        shell: bash
        env:
          TEST_SHARD: ${{ env.TEST_SHARD }}
        run: |
          set -euo pipefail
          # Separate runners own their fixed test ports. Each top-level test is
          # assigned exactly once; selecting a parent includes all its subtests.
          tests="$(go test ./internal/launcher -list '^Test' | awk -v shard="$TEST_SHARD" '/^Test[[:alnum:]_]+$/ { if (count++ % 2 == shard) print }')"
          if [[ -z "$tests" ]]; then
            echo "No native launcher tests were assigned to shard $TEST_SHARD" >&2
            exit 1
          fi
          printf '%s\n' "$tests"
          pattern="$(printf '%s\n' "$tests" | paste -sd '|' -)"
          go test -race -timeout 18m -count=1 ./internal/launcher -run "^($pattern)$"
          if [[ "$TEST_SHARD" = 0 ]]; then
            go list ./... | grep -v '/internal/launcher$' | xargs go test -race -timeout 18m -count=1
          fi

  launcher1:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.launcher != 'false' }}
    name: Darwin launcher shard 1
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TEST_SHARD: "1"
    steps: *launcher-ci-steps

  credentials-macos:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.credentials != 'false' }}
    name: Native credentials (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps: &credential-ci-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12"
      - name: Install adapter test dependencies
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @jobctrl/api rebuild better-sqlite3
          python -m pip install python-dotenv==1.2.2
      - name: Verify native credential CI contract
        if: runner.os == 'Linux'
        run: node --test scripts/native-credentials-workflow.test.mjs
      - name: Exercise fake credential batch ownership
        env:
          JOBCTRL_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: >-
          corepack pnpm --filter @jobctrl/api exec vitest run
          test/credential-mutation-lock.test.ts
          -t "serializes independent stores before rollback and keeps the newer successful value"
          --maxWorkers=1
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus libsecret-tools gnome-keyring
      - name: Exercise native Linux adapter in owned D-Bus session
        if: runner.os == 'Linux'
        run: dbus-run-session -- python scripts/native-credentials-host.py --linux-session
      - name: Exercise native Windows or macOS adapter
        if: runner.os != 'Linux'
        run: python scripts/native-credentials-host.py

  credentials-windows:
