name: Pull Request CI

# Required results share one native graph; accepted scope excludes runner work.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      storybook: ${{ steps.scope.outputs.storybook }}
      e2e: ${{ steps.scope.outputs.e2e }}
      extension: ${{ steps.scope.outputs.extension }}
      python: ${{ steps.scope.outputs.python }}
      docs: ${{ steps.scope.outputs.docs }}
      launcher: ${{ steps.scope.outputs.launcher }}
      credentials: ${{ steps.scope.outputs.credentials }}
      gmail: ${{ steps.scope.outputs.gmail }}
      distribution: ${{ steps.scope.outputs.distribution }}
      demo: ${{ steps.scope.outputs.demo }}
      edge: ${{ steps.scope.outputs.edge }}
      head_privacy: ${{ steps.scope.outputs.head_privacy }}
      preview: ${{ steps.preview.outputs.preview_allowed }}
    steps:
      - name: Checkout the exact tested merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the pinned scope runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - &resolve-policy
        name: Read the accepted policy without executing candidate code
        id: policy
        shell: bash
        env:
          POLICY_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/jobctrl-pr-policy"
          mkdir -p "$policy_dir"
          git fetch --no-tags --depth=1 origin "refs/heads/$POLICY_REF"
          policy_sha="$(git rev-parse FETCH_HEAD)"
          git archive "$policy_sha" scripts/release_check.py workers/automation/tests/test_release_check.py workers/automation/pyproject.toml workers/automation/uv.lock README.md package.json LICENSE NOTICE | tar -x -C "$policy_dir"
          if git cat-file -e "$policy_sha:scripts/pr-ci-routing.mjs" 2>/dev/null; then
            git show "$policy_sha:scripts/pr-ci-routing.mjs" > "$policy_dir/scripts/pr-ci-routing.mjs"
          fi
          echo "directory=$policy_dir" >> "$GITHUB_OUTPUT"
          echo "commit=$policy_sha" >> "$GITHUB_OUTPUT"
      - name: Set up the privacy interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up pinned base-only privacy tools
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: ${{ steps.policy.outputs.directory }}/workers/automation/uv.lock
          cache-suffix: pr-base-privacy
      - name: Sync only the accepted privacy test tools
        working-directory: ${{ steps.policy.outputs.directory }}
        run: uv --project "$POLICY_DIRECTORY/workers/automation" sync --locked --only-group release-check
        env:
          POLICY_DIRECTORY: ${{ steps.policy.outputs.directory }}
      - name: Scan the whole candidate with the accepted privacy policy
        env:
          POLICY_DIRECTORY: ${{ steps.policy.outputs.directory }}
        run: |
          python -I - <<'PYTHON'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          source = Path(os.environ["POLICY_DIRECTORY"]) / "scripts/release_check.py"
          spec = importlib.util.spec_from_file_location("trusted_release_check", source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          raise SystemExit(module.main(["--strict-prompt"]))
          PYTHON
      - name: Test the accepted privacy policy in isolation
        working-directory: ${{ steps.policy.outputs.directory }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv --project workers/automation run --locked --only-group release-check pytest -q -c /dev/null -p no:cacheprovider --noconftest workers/automation/tests/test_release_check.py
      - &compute-scope
        name: Validate and publish the exact PR scope
        id: scope
        shell: bash
        env:
          POLICY_DIRECTORY: ${{ steps.policy.outputs.directory }}
          POLICY_COMMIT: ${{ steps.policy.outputs.commit }}
          EMIT_SCOPE_NOTICE: ${{ github.job == 'preflight' }}
        run: |
          set -euo pipefail
          set -- --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_WORKSPACE" --policy "$POLICY_COMMIT" --output "$GITHUB_OUTPUT"
          if [[ "$EMIT_SCOPE_NOTICE" == true ]]; then set -- "$@" --notice; fi
          if [[ -f "$POLICY_DIRECTORY/scripts/pr-ci-routing.mjs" ]]; then
            node "$POLICY_DIRECTORY/scripts/pr-ci-routing.mjs" "$@"
          else
            # A new helper cannot authorize exclusions on its own rollout PR.
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const e = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const p = e.pull_request;
          const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request' || !p || !Number.isSafeInteger(e.number) || e.number < 1 || p.number !== e.number ||
              !Number.isSafeInteger(e.repository.id) || e.repository.id < 1 ||
              e.repository.full_name !== process.env.GITHUB_REPOSITORY || String(e.repository.id) !== process.env.GITHUB_REPOSITORY_ID ||
              p.base.repo.full_name !== process.env.GITHUB_REPOSITORY || p.base.repo.id !== e.repository.id ||
              !Number.isSafeInteger(p.head.repo?.id) || p.head.repo.id < 1 ||
              !Number.isSafeInteger(Number(process.env.GITHUB_RUN_ID)) || !Number.isSafeInteger(Number(process.env.GITHUB_RUN_ATTEMPT)) ||
              ![p.base.sha, p.head.sha, process.env.GITHUB_SHA, process.env.POLICY_COMMIT].every(sha) ||
              process.env.GITHUB_REF !== 'refs/pull/' + e.number + '/merge' ||
              !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ID ?? '') || !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ATTEMPT ?? '') ||
              git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA ||
              git('show', '-s', '--format=%P', process.env.GITHUB_SHA) !== p.base.sha + ' ' + p.head.sha) throw Error('Unverified PR merge identity: ' + JSON.stringify({
                eventBase: p.base.sha, eventHead: p.head.sha, eventMerge: p.merge_commit_sha,
                testedMerge: process.env.GITHUB_SHA, checkout: git('rev-parse', 'HEAD'),
                parents: git('show', '-s', '--format=%P', process.env.GITHUB_SHA),
                eventRepository: e.repository.full_name, environmentRepository: process.env.GITHUB_REPOSITORY,
                eventRepositoryId: e.repository.id, environmentRepositoryId: process.env.GITHUB_REPOSITORY_ID,
                eventNumber: e.number, eventPullRequestNumber: p.number, ref: process.env.GITHUB_REF,
              }));
          const suites = ["api","web","storybook","e2e","extension","python","docs","launcher","credentials","gmail","distribution","demo","edge"];
          const names = ["Release check","Script unit tests","API checks and tests","Web unit, types, and build","Storybook build and browser tests","Web end-to-end","Browser extension","Python 3.11","Python 3.12","Python 3.13","Build (dead-link gate)","Darwin launcher shard 0","Darwin launcher shard 1","Native credentials (macos-latest)","Native credentials (windows-latest)","Native credentials (ubuntu-latest)","Synthetic Gmail token ACL (Windows)","Release distribution contracts","Build and verify demo","Demo edge checks"];
          const selected = Object.fromEntries(suites.map(id => [id, true]));
          const scope = {
            schemaVersion: 1, repository: { id: e.repository.id, fullName: process.env.GITHUB_REPOSITORY },
            pullRequest: e.number, run: { id: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
            event: 'pull_request', base: { ref: p.base.ref, sha: p.base.sha },
            head: { repoId: p.head.repo?.id ?? null, sha: p.head.sha },
            mergeSha: process.env.GITHUB_SHA, policy: { commit: process.env.POLICY_COMMIT, blob: 'bootstrap' },
            mode: 'full', reason: 'bootstrap', selected, contexts: Object.fromEntries(names.map(name => [name, true])), headPrivacy: true,
          };
          appendFileSync(process.env.GITHUB_OUTPUT, [...suites.map(id => id + '=true'), 'head_privacy=true'].join('\n') + '\n');
          if (process.env.EMIT_SCOPE_NOTICE === 'true') console.log('::notice title=JobCtrl CI scope v1::' + JSON.stringify(scope).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          NODE
          fi

      - name: Preserve the original static preview input scope
        id: preview
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ADMITTED_AFFECTED: ${{ steps.scope.outputs.head_privacy == 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          let allowed = false;
          try {
            if (process.env.ADMITTED_AFFECTED !== 'true') throw Error('No affected-only admission');
            const raw = execFileSync('git', ['diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', process.env.PR_BASE_SHA, process.env.GITHUB_SHA, '--'], { maxBuffer: 32 * 1024 * 1024 });
            const paths = new TextDecoder('utf-8', { fatal: true }).decode(raw).split('\0');
            if (paths.pop() !== '') throw Error('Incomplete preview diff');
            allowed = paths.some(path => path.startsWith('apps/web/') || path.startsWith('packages/') ||
              ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.github/workflows/demo-site.yml'].includes(path) ||
              /^scripts\/demo-[^/]*\.mjs$/.test(path));
          } catch {
            console.log('Static preview disabled: full/uncertain admission or original inputs not established.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'preview_allowed=' + allowed + '\n');
          NODE

  scripts:
    needs: preflight
    name: Script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python for changed candidate privacy policy
        if: ${{ needs.preflight.outputs.head_privacy != 'false' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Scan the pristine tree with changed candidate privacy rules
        if: ${{ needs.preflight.outputs.head_privacy != 'false' }}
        run: python -I scripts/release_check.py --strict-prompt
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        id: dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Test repository scripts
        timeout-minutes: 10
        run: corepack pnpm scripts:test

  api:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.api != 'false' }}
    name: API checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check shared contracts and API
        run: |
          node scripts/sync-semantic-taxonomy.mjs --check
          corepack pnpm --filter @jobctrl/contracts check
          corepack pnpm --filter @jobctrl/api-client check
          corepack pnpm --filter @jobctrl/domain-types check
          corepack pnpm api:check
      - name: Set up pinned uv for real worker RPC tests
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Prepare locked worker project
        run: uv --project workers/automation sync --locked --all-extras
      - name: Test shared domain types
        run: corepack pnpm --filter @jobctrl/domain-types test
      - name: Test API
        run: corepack pnpm api:test

  web:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.web != 'false' }}
    name: Web unit, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint web boundaries
        run: corepack pnpm web:lint
      - name: Check web
        run: corepack pnpm web:check
      - name: Test web
        run: corepack pnpm web:test
      - name: Test public web types
        run: corepack pnpm web:test-d
      - name: Build web
        run: corepack pnpm web:build

  storybook:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.storybook != 'false' }}
    name: Storybook build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        id: dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build Storybook
        run: corepack pnpm web:storybook:build
      - name: Install Playwright Chromium
        run: corepack pnpm --filter @jobctrl/web exec playwright install --with-deps chromium
      - name: Test Storybook
        run: corepack pnpm web:storybook:test
      - name: Test frontend boundary regression controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: corepack pnpm web:lint:test

  e2e:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.e2e != 'false' }}
    name: Web end-to-end
    runs-on: ubuntu-latest
    # Browser/PDF setup shares this budget with both complete E2E suites.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Install locked dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          uv --project workers/automation sync --locked --all-extras
      - name: Install Playwright browsers
        run: |
          corepack pnpm --filter @jobctrl/web exec playwright install --with-deps chromium
          uv --project workers/automation run --locked --all-extras playwright install chromium
      - name: Prepare PDF measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          corepack pnpm --filter @jobctrl/web e2e:check-pdf-tools
      - name: Test web end-to-end
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/e2e-isolated.xml
          JOBCTRL_E2E_ISOLATED: "1"
          JOBCTRL_E2E_PROFILE_SUGGESTIONS: "1"
        run: corepack pnpm web:e2e
      - name: Test real API and worker RPC boundaries
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/e2e-real-rpc.xml
          JOBCTRL_E2E_ISOLATED: "0"
          JOBCTRL_E2E_PROFILE_SUGGESTIONS: "0"
          JOBCTRL_E2E_WEB_SERVER: dev
          JOBCTRL_E2E_APP_DIR: /tmp/jobctrl-real-rpc-e2e
        run: |
          mkdir -p "$JOBCTRL_E2E_APP_DIR"
          corepack pnpm --filter @jobctrl/web exec playwright test --config e2e/playwright.config.ts \
            e2e/tests/discovery-saved-views.spec.ts e2e/tests/repeat-application.spec.ts \
            e2e/tests/dry-run-completed.spec.ts e2e/tests/event-stream-first-open.spec.ts e2e/tests/accepted-material-exports.spec.ts \
            e2e/tests/offer-outcomes.spec.ts
      - name: Upload synthetic first-connection screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-first-connection-screenshots
          path: |
            ${{ runner.temp }}/e2e-isolated.xml.artifacts/**/first-open-*.png
            ${{ runner.temp }}/e2e-real-rpc.xml.artifacts/**/first-open-*.png
          if-no-files-found: ignore

      - name: Upload synthetic E2E JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-junit-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e-isolated.xml
            ${{ runner.temp }}/e2e-real-rpc.xml
          retention-days: 7
          if-no-files-found: warn

  extension:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.extension != 'false' }}
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: corepack pnpm --filter @jobctrl/extension exec playwright install --with-deps chromium
      - name: Check, test, and exercise extension
        run: |
          corepack pnpm extension:check
          corepack pnpm extension:test
          xvfb-run --auto-servernum corepack pnpm extension:e2e

  python311:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.python != 'false' }}
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_VERSION: "3.11"
      PYTHONFAULTHANDLER: "1"

    steps: &python-ci-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: py${{ env.PYTHON_VERSION }}
      - name: Sync the locked dependency graph
        run: uv --project workers/automation sync --locked --all-extras
      - name: Lint
        run: uv --project workers/automation run --locked --all-extras ruff check workers/automation/src workers/automation/tests
      - name: Check generated semantic result contracts
        run: uv --project workers/automation run --locked --all-extras python scripts/generate-semantic-result-schemas.py --check
      - name: Enable Linux user namespaces for Bubblewrap
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          # Bubblewrap needs unprivileged user namespaces on GitHub-hosted
          # Linux runners for the sandboxed Codex SDK regression test.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Use memory-backed temp storage when available
        shell: bash
        run: |
          set -euo pipefail

          # Hosted-runner disk latency once stretched the SQLite migration
          # tests from ~50s to ~620s in one lane; tmpfs removes that
          # amplification. The macOS launcher workflow still exercises the
          # migration boundary on real disk.
          if [[ -d /dev/shm && -w /dev/shm ]]; then
            tmpdir="/dev/shm/jobctrl-${GITHUB_RUN_ID}-py${{ env.PYTHON_VERSION }}"
            mkdir -p "$tmpdir"
            echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
          fi
      - name: Install verified Temporal CLI for integration tests
        shell: bash
        run: |
          set -euo pipefail

          # Pin the Linux archive for the same CLI version used by the
          # packaged runtime. Avoid SDK downloads during individual tests.
          if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
            echo "No verified Temporal CLI for $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/jobctrl-temporal-linux-amd64.tar.gz"
          executable_dir="$RUNNER_TEMP/jobctrl-temporal-linux-amd64"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 120 \
            --output "$archive" \
            https://github.com/temporalio/cli/releases/download/v1.7.3/temporal_cli_1.7.3_linux_amd64.tar.gz
          printf '%s  %s\n' '32a4320080342bccab37633b8777f548aa0b413c3d37fdbc7cb9d861c5fa11d0' "$archive" | sha256sum --check
          mkdir -p "$executable_dir"
          tar -xOf "$archive" temporal > "$executable_dir/temporal"
          chmod 700 "$executable_dir/temporal"
          "$executable_dir/temporal" --version
          echo "JOBCTRL_TEMPORAL_CLI_PATH=$executable_dir/temporal" >> "$GITHUB_ENV"
      - name: Install verified Temporal time-skipping test server
        shell: bash
        run: bash scripts/install-temporal-test-server.sh
      - name: Install Chromium for guarded availability regression
        run: uv --project workers/automation run --locked --all-extras playwright install --with-deps chromium
      - name: Test
        run: uv --project workers/automation run --locked --all-extras pytest workers/automation/tests -q -n 2 --dist=loadfile --max-worker-restart=0 --durations=25 --junitxml="$RUNNER_TEMP/python-$PYTHON_VERSION.xml"
      - name: Build package
        run: uv --project workers/automation run --locked --all-extras python -m build --no-isolation workers/automation

      - name: Upload synthetic Python JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ env.PYTHON_VERSION }}-junit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-${{ env.PYTHON_VERSION }}.xml
          retention-days: 7
          if-no-files-found: warn

  python312:
    needs: preflight
