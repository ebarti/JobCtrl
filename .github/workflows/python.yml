name: Python CI

# `push` is filtered to the files this suite actually reads. Beyond workers/ and
# scripts/, `packages/**` holds the shared cross-runtime parity fixtures and the
# domain-event sources, `packaging/**` holds provider-packs.lock.json and
# capability-policy.json, the INV-1 no-send-transport guard
# (test_outreach_no_send_transport.py) scans the TypeScript outreach sources
# under apps/, the byline/attribution tests read root package.json, README.md,
# LICENSE, and NOTICE, and the release-scan tests read workflow files under
# `.github/workflows/**`. A push that changed any of those without these entries
# would skip the suite covering it.
#
# `pull_request` deliberately takes no filter at all — no `branches`, no
# `paths`. Every layer of a GitHub stack must instantiate this workflow so it
# produces a check record for that layer; a filtered-out workflow reports
# nothing rather than reporting a skip. Cost is controlled at the job level
# instead, by the `if:` below that admits only a trusted cumulative head, which
# is the pattern GitHub documents for stacked pull requests. Enforced by
# scripts/stacked-ci-workflows.test.mjs — do not add a filter here.
on:
  push:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "packages/**"
      - "packaging/**"
      - "apps/web/src/contexts/outreach/**"
      - "apps/web/src/views/outreach/**"
      - "apps/api/src/outreach.ts"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # Run hosted dependencies and product tests only for the trusted cumulative
    # head. Lower stack layers retain their no-cost skipped check record.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    name: Python (workers/automation)
    runs-on: ubuntu-latest
    strategy:
      # A failure in one top compatibility lane must not cancel the others;
      # every supported Python version owns an independent product result.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: workers/automation/pyproject.toml

      - name: Install dependencies
        run: pip install -e "workers/automation[dev,providers]"

      - name: Lint
        run: ruff check workers/automation/src workers/automation/tests

      - name: Release scan
        run: python scripts/release_check.py

      - name: Validate Python workflow contract
        run: node scripts/check-python-workflow-contract.mjs

      - name: Enable Linux user namespaces for Bubblewrap
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          # Bubblewrap needs unprivileged user namespaces on GitHub-hosted Linux
          # runners. This step runs in each Python matrix lane before the
          # sandboxed Codex SDK regression test.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            echo "Enabling kernel.unprivileged_userns_clone for Bubblewrap."
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          # Ubuntu 24.04+ can additionally block unprivileged user namespaces
          # via AppArmor, which prevents Bubblewrap from configuring loopback.
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            echo "Disabling kernel.apparmor_restrict_unprivileged_userns for Bubblewrap."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        run: pytest workers/automation/tests -v

      - name: Build package
        run: python -m build workers/automation
