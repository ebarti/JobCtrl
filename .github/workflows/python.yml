name: Python CI

on:
  push:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  python:
    # Same-repository stacks are trusted to run hosted CI; public forks retain
    # the maintainer-reviewed manual validation path documented in CONTRIBUTING.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Python (workers/automation)
    runs-on: ubuntu-latest
    strategy:
      # A failure in one top compatibility lane must not cancel the others;
      # every supported Python version owns an independent product result.
      fail-fast: false
      matrix:
        # Every matching stack layer gets the 3.11 correctness lane. The top
        # layer contains the cumulative stack and also exercises compatibility.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.stack != null && github.event.pull_request.stack.position != github.event.pull_request.stack.size && '["3.11"]' || '["3.11","3.12","3.13"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e "workers/automation[dev,providers]"

      - name: Lint
        run: ruff check workers/automation/src workers/automation/tests

      - name: Release scan
        run: python scripts/release_check.py

      - name: Validate Python workflow contract
        run: node scripts/check-python-workflow-contract.mjs

      - name: Enable Linux user namespaces for Bubblewrap
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          # Bubblewrap needs unprivileged user namespaces on GitHub-hosted Linux
          # runners. This step runs in each Python matrix lane before the
          # sandboxed Codex SDK regression test.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            echo "Enabling kernel.unprivileged_userns_clone for Bubblewrap."
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          # Ubuntu 24.04+ can additionally block unprivileged user namespaces
          # via AppArmor, which prevents Bubblewrap from configuring loopback.
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            echo "Disabling kernel.apparmor_restrict_unprivileged_userns for Bubblewrap."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        # Approved stack layers can be intentionally non-installable review
        # slices. Exercise the product suite only on a cumulative head.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
        run: pytest workers/automation/tests -v

      - name: Build package
        run: python -m build workers/automation
