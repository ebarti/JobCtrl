name: Python CI
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_VERSION: '3.12'
      UV_PYTHON: '3.12'
      PYTHONFAULTHANDLER: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "${{ env.PYTHON_VERSION }}"
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.11.7
        enable-cache: true
        cache-dependency-glob: workers/automation/uv.lock
        cache-suffix: py${{ env.PYTHON_VERSION }}
    - name: Sync the locked dependency graph
      run: uv --project workers/automation sync --locked --all-extras
    - name: Run the complete primary worker recipe
      uses: "./.github/actions/worker-checks"
