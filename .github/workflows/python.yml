name: Python CI

on:
  push:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "packages/**"
      - "packaging/**"
      - "apps/web/src/contexts/outreach/**"
      - "apps/web/src/views/outreach/**"
      - "apps/api/src/outreach.ts"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/python.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Python static and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: py3.12-quality
      - name: Sync the exact candidate graph
        run: uv --project workers/automation sync --locked --all-extras
      - name: Record the locked graph
        run: uv --project workers/automation tree --locked --depth 1
      - name: Lint
        run: uv --project workers/automation run --locked --all-extras ruff check workers/automation/src workers/automation/tests
      - name: Validate Python workflow contract
        run: node scripts/check-python-workflow-contract.mjs
      - name: Build package once
        run: uv --project workers/automation run --locked --all-extras python -m build --no-isolation workers/automation

  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: ["core", "temporal", "migration"]
    env:
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: py${{ matrix.python-version }}
      - name: Sync the exact candidate graph
        run: uv --project workers/automation sync --locked --all-extras
      - name: Record deterministic test seed
        shell: bash
        run: |
          set -euo pipefail
          seed=$((GITHUB_RUN_ID % 4294967295))
          echo "PYTEST_RANDOMLY_SEED=$seed" >> "$GITHUB_ENV"
          printf 'pytest-randomly seed: %s\n' "$seed" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Use memory-backed storage for migration fixtures
        if: matrix.shard == 'migration'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /dev/shm && -w /dev/shm ]]; then
            tmpdir="/dev/shm/jobctrl-${GITHUB_RUN_ID}-${GITHUB_JOB}-${{ matrix.python-version }}"
            mkdir -p "$tmpdir"
            echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
            echo "Migration shard temp root: \`$tmpdir\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable Linux user namespaces for Bubblewrap
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test shard
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            core) marker='not temporal and not migration' ;;
            temporal) marker='temporal' ;;
            migration) marker='migration' ;;
            *) echo "unknown shard: ${{ matrix.shard }}" >&2; exit 2 ;;
          esac
          uv --project workers/automation run --locked --all-extras pytest \
            workers/automation/tests \
            -q -m "$marker" \
            --randomly-seed="$PYTEST_RANDOMLY_SEED" \
            --durations=50 \
            --junitxml="$RUNNER_TEMP/python-${{ matrix.python-version }}-${{ matrix.shard }}.xml"
      - name: Run one disk-backed migration smoke
        if: matrix.python-version == '3.12' && matrix.shard == 'migration'
        env:
          TMPDIR: ${{ runner.temp }}/jobctrl-migration-disk-smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          uv --project workers/automation run --locked --all-extras pytest \
            workers/automation/tests/test_v6_to_v7_preflight.py \
            -q --randomly-seed="$PYTEST_RANDOMLY_SEED" \
            --durations=20 \
            --junitxml="$RUNNER_TEMP/python-3.12-migration-disk-smoke.xml"
      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python-version }}-${{ matrix.shard }}-diagnostics
          path: ${{ runner.temp }}/python-${{ matrix.python-version }}-${{ matrix.shard }}*.xml
          if-no-files-found: warn
          retention-days: 14
