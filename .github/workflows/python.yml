name: Python CI

on:
  push:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "workers/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  python:
    name: Python (workers/automation)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e "workers/automation[dev]"

      - name: Install LaTeX
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra

      - name: Lint
        run: ruff check workers/automation/src workers/automation/tests

      - name: Release scan
        run: python scripts/release_check.py

      - name: Test
        run: pytest workers/automation/tests -v

      - name: Build package
        run: python -m build workers/automation
