name: Python CI

on:
  push:
    branches: ["main"]
    paths:
      - "workers/**"
      - "scripts/**"
      - "packages/**"
      - "packaging/**"
      - "apps/web/src/contexts/outreach/**"
      - "apps/web/src/views/outreach/**"
      - "apps/api/src/outreach.ts"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "workers/**"
      - "scripts/**"
      - "packages/**"
      - "packaging/**"
      - "apps/web/src/contexts/outreach/**"
      - "apps/web/src/views/outreach/**"
      - "apps/api/src/outreach.ts"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: py${{ matrix.python-version }}
      - name: Sync the locked dependency graph
        run: uv --project workers/automation sync --locked --all-extras
      - name: Lint
        run: uv --project workers/automation run --locked --all-extras ruff check workers/automation/src workers/automation/tests
      - name: Enable Linux user namespaces for Bubblewrap
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          # Bubblewrap needs unprivileged user namespaces on GitHub-hosted
          # Linux runners for the sandboxed Codex SDK regression test.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        run: uv --project workers/automation run --locked --all-extras pytest workers/automation/tests -q
      - name: Build package
        run: uv --project workers/automation run --locked --all-extras python -m build --no-isolation workers/automation
