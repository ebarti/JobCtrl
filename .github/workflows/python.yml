name: Python CI
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_VERSION: '3.12'
      UV_PYTHON: '3.12'
      PYTHONFAULTHANDLER: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "${{ env.PYTHON_VERSION }}"
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.11.7
        enable-cache: true
        cache-dependency-glob: workers/automation/uv.lock
        cache-suffix: py${{ env.PYTHON_VERSION }}
    - name: Sync the locked dependency graph
      run: uv --project workers/automation sync --locked --all-extras
    - name: Run the complete primary worker recipe
      uses: "./.github/actions/worker-checks"
