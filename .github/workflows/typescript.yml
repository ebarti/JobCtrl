name: TypeScript CI
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: Manual API
    uses: "./.github/workflows/ci-backend.yml"
    with:
      api: true
      python: false
      head_privacy: true
      distribution: false
      edge: false
  frontend:
    name: Manual web
    uses: "./.github/workflows/ci-frontend.yml"
    with:
      web: true
      storybook: false
      e2e: false
      extension: false
      docs: false
      demo: false
  support:
    name: Manual support
    uses: "./.github/workflows/ci-frontend.yml"
    with:
      web: false
      storybook: true
      e2e: false
      extension: true
      docs: false
      demo: false
  browser:
    name: Manual browser
    uses: "./.github/workflows/ci-frontend.yml"
    with:
      web: false
      storybook: false
      e2e: true
      extension: false
      docs: false
      demo: false
