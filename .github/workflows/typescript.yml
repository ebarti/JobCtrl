name: TypeScript CI

# `push` is filtered to the files this suite actually reads. Beyond apps/ and
# packages/, `workers/**` supplies schema_v7.sql, schema_manifest.py, and
# config.py to the cross-runtime parity and schema-guard tests, and `scripts/**`
# supplies the install script the install contract test executes. A push that
# changed either without those entries would skip the suite covering it.
#
# `pull_request` deliberately takes no filter at all — no `branches`, no
# `paths`. Every layer of a GitHub stack must instantiate this workflow so it
# produces a check record for that layer; a filtered-out workflow reports
# nothing rather than reporting a skip. Cost is controlled at the job level
# instead, by the `if:` below that admits only a trusted cumulative head, which
# is the pattern GitHub documents for stacked pull requests. Enforced by
# scripts/stacked-ci-workflows.test.mjs — do not add a filter here.
on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "workers/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    # Run hosted dependencies and product tests only for the trusted cumulative
    # head. Lower stack layers retain their no-cost skipped check record.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    name: TypeScript (apps + packages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm -r check

      - name: Test
        run: pnpm --filter @jobctrl/api test

      - name: Test web
        run: pnpm --filter @jobctrl/web test

      - name: Test web types
        run: pnpm --filter @jobctrl/web test-d

      - name: Build web
        run: pnpm --filter @jobctrl/web build

      - name: Build web storybook
        run: pnpm --filter @jobctrl/web storybook:build

      - name: Install Playwright Chromium
        run: pnpm --filter @jobctrl/web exec playwright install --with-deps chromium

      - name: Install Python Playwright Chromium
        run: uv --project workers/automation run playwright install chromium

      - name: Test web e2e
        run: pnpm --filter @jobctrl/web e2e

      - name: Test web storybook
        run: pnpm --filter @jobctrl/web storybook:test
