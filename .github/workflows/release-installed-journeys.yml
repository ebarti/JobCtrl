name: Installed release journeys

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      candidate_artifact_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  journeys:
    name: Installed Chromium (${{ matrix.shard }}/4)
    runs-on: macos-15
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the audited test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the qualification inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download the unsigned archive built for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/installed-candidate

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1

      - name: Fetch the fixed source-upgrade predecessors
        run: node scripts/fetch-e2e-predecessors.mjs

      - name: Install the locked test dependencies and Poppler
        run: |
          corepack pnpm install --frozen-lockfile
          if ! command -v pdftoppm >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install poppler
          fi
          pdftoppm -v

      - name: Run this shard against the extracted unsigned archive
        run: |
          node scripts/distribution-build.mjs qualify-installed-journey-shard \
            --candidate "$RUNNER_TEMP/installed-candidate" --shard "${{ matrix.shard }}" \
            --output "$RUNNER_TEMP/qualification.json" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Retain the passing shard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jobctrl-installed-journeys-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain failed installed qualification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jobctrl-installed-qualification-failure-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            /private/tmp/jobctrl-transform-1428/e2e-*/timings.json
            /private/tmp/jobctrl-transform-1428/e2e-*/junit.xml
            /private/tmp/jobctrl-transform-1428/e2e-*/playwright/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
