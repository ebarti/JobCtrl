name: Reliability deployment guard

on:
  push:
    branches: ["qa/reliability-deploy-guard-20261028"]

permissions:
  deployments: read

jobs:
  linux-guard:
    name: Deployment guards and baseline are safe
    if: ${{ vars.DEMO_DEPLOY_ENABLED == 'false' && vars.DOCS_DEPLOY_ENABLED == 'false' && vars.DEMO_PREVIEW_DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify unchanged deployment baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ebarti/JobCtrl/deployments?per_page=1" \
            | jq -e '.[0].id == 7367367170 and .[0].environment == "demo-production"' > /dev/null
          echo "Deployment guards and baseline are safe."

  windows-guard:
    name: Deployment guards and baseline are safe (Windows)
    if: ${{ vars.DEMO_DEPLOY_ENABLED == 'false' && vars.DOCS_DEPLOY_ENABLED == 'false' && vars.DEMO_PREVIEW_DEPLOY_ENABLED != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify unchanged deployment baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $latest = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/ebarti/JobCtrl/deployments?per_page=1")[0]
          if (-not $latest -or $latest.id -ne 7367367170 -or $latest.environment -ne "demo-production") { throw "Deployment baseline changed or is unavailable." }
          Write-Output "Deployment guards and baseline are safe."

  unsafe-guard:
    name: Unsafe deployment guards
    if: ${{ vars.DEMO_DEPLOY_ENABLED != 'false' || vars.DOCS_DEPLOY_ENABLED != 'false' || vars.DEMO_PREVIEW_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsafe deployment guards
        run: exit 1
