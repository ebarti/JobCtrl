name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened, transferred]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage manually.
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Label issue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply triage labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number ?? Number(context.payload.inputs?.issue_number);

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const { triageIssue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/issue-triage.mjs`);
            await triageIssue({ github, owner, repo, issue });
