name: Trusted privacy admission
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  preflight:
    name: Release check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the standard-library privacy interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Read accepted rules without executing candidate code
        shell: bash
        env:
          POLICY_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/jobctrl-accepted-privacy"
          mkdir -p "$policy_dir"
          git fetch --no-tags --depth=1 origin "refs/heads/$POLICY_REF"
          git show FETCH_HEAD:scripts/release_check.py > "$policy_dir/release_check.py"
          echo "JOBCTRL_ACCEPTED_PRIVACY=$policy_dir/release_check.py" >> "$GITHUB_ENV"
          echo "Accepted privacy policy: $(git rev-parse FETCH_HEAD)"
      - name: Scan the whole candidate with the accepted policy
        run: |
          python -I - <<'PYTHON'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          source = Path(os.environ['JOBCTRL_ACCEPTED_PRIVACY'])
          spec = importlib.util.spec_from_file_location('trusted_release_check', source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.ROOT = Path(os.environ['GITHUB_WORKSPACE'])
          raise SystemExit(module.main(['--strict-prompt']))
          PYTHON
