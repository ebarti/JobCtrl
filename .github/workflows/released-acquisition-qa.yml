name: Released acquisition upgrade QA

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Signed candidate workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  repaired-acquisition:
    name: Exercise the signed candidate with the corrected source fixture
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: launcher/go.mod
      - name: Install locked dependencies and build the fixture controller
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          go -C launcher build -o "$RUNNER_TEMP/jobctrl-source-qa" ./cmd/jobctrl-source
      - name: Download the exact retained signed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: jobctrl-release-candidate-${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/release
      - name: Verify candidate checksums and obtain prior public trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/trust"
          gh release download v0.3.1 --repo "$GITHUB_REPOSITORY" --pattern release-keys.json --dir "$RUNNER_TEMP/trust"
      - name: Qualify real curl and Homebrew acquisition paths
        env:
          JOBCTRL_RELEASE_QA_SOURCE_BINARY: ${{ runner.temp }}/jobctrl-source-qa
          JOBCTRL_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export JOBCTRL_RELEASE_KEY_ID="$(jq -r '.manifestSigning.keyId' packaging/distribution/signing-policy.json)"
          export JOBCTRL_RELEASE_PUBLIC_KEY="$(jq -r --arg id "$JOBCTRL_RELEASE_KEY_ID" '.keys[$id]' "$RUNNER_TEMP/trust/release-keys.json")"
          test -n "$JOBCTRL_RELEASE_PUBLIC_KEY" && test "$JOBCTRL_RELEASE_PUBLIC_KEY" != null
          node scripts/released-acquisition-upgrade.mjs --release-dir "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/released-acquisition-upgrade.json"
      - name: Retain acquisition evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repaired-acquisition-${{ github.run_id }}
          path: ${{ runner.temp }}/released-acquisition-upgrade.json
          if-no-files-found: error
          retention-days: 14
