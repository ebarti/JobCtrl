name: Native sharding diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_REPO: ebarti/JobCtrl
      RELEASE_TAG: v0.4.0
      RELEASE_CHANNEL: stable
      RELEASE_REF: abbadc0070425609eb61369868644ee243d7d783
      RELEASE_BUILD_ID: 0.4.0-abbadc0070425609eb61369868644ee243d7d783-darwin-arm64
      SOURCE_DATE_EPOCH: '1793327658'
      EXPECTED_RELEASE_KEY_ID: jobctrl-release-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.1
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run focused fixture
        run: node --test scripts/launcher-ci-shard.test.mjs
      - name: Run the same full script suite as pre-sign
        run: corepack pnpm scripts:test
