name: Released acquisition upgrade QA

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Diagnostic label
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose-notary:
    name: Inspect notarization on a fresh macOS runner
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3, 4]
    timeout-minutes: 10
    steps:
      - name: Download and authenticate the exact release binary
        shell: bash
        run: |
          set -euo pipefail
          candidate_url="https://releases.jobctrl.dev/v1/artifacts/0.4.0-0b2efd3f9a54765d02eb9384772ab52ae9d48f6d-darwin-arm64/jobctrl-0.4.0-darwin-arm64.zip"
          status="$(curl --fail --silent --show-error --range 0-1999999 --output "$RUNNER_TEMP/archive-head" --write-out '%{http_code}' "$candidate_url")"
          test "$status" = 206
          python3 - "$RUNNER_TEMP/archive-head" "$RUNNER_TEMP/better_sqlite3.node" <<'PY'
          import hashlib, pathlib, struct, sys, zlib
          data = pathlib.Path(sys.argv[1]).read_bytes()
          offset = 737
          header = struct.unpack_from('<IHHHHHIIIHH', data, offset)
          assert header[0] == 0x04034b50
          name = data[offset + 30:offset + 30 + header[-2]].decode()
          assert name == 'api/node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          inflater = zlib.decompressobj(-15)
          content = inflater.decompress(data[offset + 30 + header[-2] + header[-1]:])
          assert inflater.eof and hashlib.sha256(content).hexdigest() == '73e0f1e796f9454b7ecd68220d97f51fc6e2532f9ad1271db0c93382b116468f'
          pathlib.Path(sys.argv[2]).write_bytes(content)
          PY
          chmod 755 "$RUNNER_TEMP/better_sqlite3.node"
          sw_vers
          file "$RUNNER_TEMP/better_sqlite3.node"
          shasum -a 256 "$RUNNER_TEMP/better_sqlite3.node"
          /usr/bin/codesign --verify --strict --verbose=4 "$RUNNER_TEMP/better_sqlite3.node"
      - name: Capture repeated Apple notarization checks
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Trial ${{ matrix.trial }}, check $attempt"
            /usr/bin/codesign --verify --strict --check-notarization -R=notarized --verbose=4 "$RUNNER_TEMP/better_sqlite3.node"
            result=$?
            echo "Notarization check exit: $result"
            sleep 2
          done
