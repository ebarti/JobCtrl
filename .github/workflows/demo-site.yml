name: Demo Site

on:
  workflow_call:
    inputs:
      verify_edge:
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "apps/demo-edge/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/demo-*.mjs"
      - ".github/workflows/demo-site.yml"
  workflow_dispatch:
    inputs:
      verify_edge:
        description: Validate edge workers before a direct manual deployment
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: demo-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and verify demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify deployment contracts
        run: corepack pnpm scripts:test:demo

      - name: Verify edge workers
        # Pull requests and merge groups run these commands in the independently
        # routed TypeScript demo-edge job. Main/manual deployment keeps the gate
        # here so production cannot publish ahead of its own edge validation.
        if: ${{ github.event_name == 'push' || inputs.verify_edge }}
        run: corepack pnpm demo-edge:check && corepack pnpm demo-edge:test && corepack pnpm demo-edge:dry-run

      - name: Build browser-local demo
        run: corepack pnpm demo:build

      - name: Upload demo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site-dist
          path: dist/web
          retention-days: 7

  preview:
    name: Deploy static preview
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEMO_PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1

      - name: Download demo artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-site-dist
          path: dist/web

      - name: Publish static preview
        run: corepack pnpm dlx wrangler@4.107.0 pages deploy dist/web --project-name=jobctrl-demo --branch="$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  production:
    name: Deploy production demo
    needs: build
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_edge)) &&
      github.ref == 'refs/heads/main' &&
      vars.DEMO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo-production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download demo artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-site-dist
          path: dist/web

      - name: Apply telemetry migrations
        run: corepack pnpm --dir apps/demo-edge exec wrangler d1 migrations apply DEMO_TELEMETRY_DB --remote --config wrangler.api.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy consent and telemetry API
        run: corepack pnpm --dir apps/demo-edge exec wrangler deploy --config wrangler.api.jsonc --var "DEMO_RELEASE:${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy retention worker
        run: corepack pnpm --dir apps/demo-edge exec wrangler deploy --config wrangler.retention.jsonc --var "DEMO_RELEASE:${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publish production site
        run: corepack pnpm --dir apps/demo-edge exec wrangler pages deploy ../../dist/web --project-name=jobctrl-demo --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke production consent boundary
        run: corepack pnpm demo:smoke
        env:
          DEMO_BASE_URL: https://demo.jobctrl.dev
