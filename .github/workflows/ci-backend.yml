name: Backend verification
'on':
  workflow_call:
    inputs:
      api:
        type: boolean
        default: true
      python:
        type: boolean
        default: true
      head_privacy:
        type: boolean
        default: true
      distribution:
        type: boolean
        default: true
      edge:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checks:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHON_VERSION: '3.12'
      UV_PYTHON: '3.12'
      PYTHONFAULTHANDLER: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python for changed candidate privacy policy
      if: "${{ inputs.api || inputs.python || inputs.head_privacy }}"
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Scan the pristine tree with changed candidate privacy rules
      if: "${{ inputs.head_privacy }}"
      run: python -I scripts/release_check.py --strict-prompt
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
        cache: pnpm
    - name: Install locked dependencies
      id: dependencies
      run: corepack pnpm install --frozen-lockfile
    - name: Test repository scripts
      timeout-minutes: 10
      run: corepack pnpm scripts:test
    - name: Check shared contracts and API
      run: |
        node scripts/sync-semantic-taxonomy.mjs --check
        corepack pnpm --filter @jobctrl/contracts check
        corepack pnpm --filter @jobctrl/api-client check
        corepack pnpm --filter @jobctrl/domain-types check
        corepack pnpm api:check
      if: "${{ inputs.api }}"
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.11.7
        enable-cache: true
        cache-dependency-glob: workers/automation/uv.lock
        cache-suffix: py${{ env.PYTHON_VERSION }}
      if: "${{ inputs.api || inputs.python || inputs.distribution }}"
    - name: Sync the locked dependency graph
      run: uv --project workers/automation sync --locked --all-extras
      if: "${{ inputs.api || inputs.python }}"
    - name: Test shared domain types
      run: corepack pnpm --filter @jobctrl/domain-types test
      if: "${{ inputs.api }}"
    - name: Test API
      run: corepack pnpm api:test
      if: "${{ inputs.api }}"
    - name: Run the complete primary worker recipe
      if: "${{ inputs.python }}"
      uses: "./.github/actions/worker-checks"
    - name: Use the owned runner directory for remaining tooling
      if: "${{ inputs.python }}"
      run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Audit release distribution contracts
      run: corepack pnpm distribution:audit
      if: "${{ inputs.distribution }}"
    - name: Verify edge workers
      run: corepack pnpm demo-edge:check && corepack pnpm demo-edge:test && corepack
        pnpm demo-edge:dry-run
      if: "${{ inputs.edge }}"
