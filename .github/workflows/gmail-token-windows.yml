name: Gmail token Windows privacy
'on':
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  private-token:
    name: Synthetic Gmail token ACL (Windows)
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      UV_PYTHON: '3.12'
      UV_LOCKED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Prepare the exact application runtime without provider SDK groups
        run: uv --project workers/automation sync --locked --no-default-groups --no-dev
      - name: Exercise real public OAuth command and native Windows DACLs
        run: uv --project workers/automation run --locked --no-default-groups --no-dev python scripts/qa/gmail-token-e2e.py --workspace-root "$env:RUNNER_TEMP" --require-windows
      - name: Require unchanged dependency locks
        if: always()
        run: git diff --exit-code -- workers/automation/uv.lock
