name: Docs Site

# The negated directories match docs/.vitepress/config.ts `srcExclude`: nothing
# under them can enter the built site, so building for them is pure cost.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "!docs/plans/**"
      - "!docs/incidents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-install-asset.mjs"
      - "scripts/check-docs-site-links.mjs"
      - "scripts/check-docs-site-redirects.mjs"
      - "scripts/get"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "!docs/plans/**"
      - "!docs/incidents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-install-asset.mjs"
      - "scripts/check-docs-site-links.mjs"
      - "scripts/check-docs-site-redirects.mjs"
      - "scripts/get"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified artifact after a successful build
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (dead-link gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so VitePress lastUpdated timestamps are real.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build docs site
        run: corepack pnpm docs:build

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Deploys only from main, and only once the repository variable
    # DOCS_DEPLOY_ENABLED is set to "true" alongside the two Cloudflare
    # secrets. Until then this job skips cleanly and the workflow stays green.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DOCS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=jobctrl-docs --branch=main
