name: Docs Site

# This workflow exists to build the published site and gate its dead links, so
# it should run exactly when the published site can change. The directories
# negated below are listed in the `srcExclude` of docs/.vitepress/config.ts:
# VitePress never builds a page from them, links into them are rewritten to
# absolute GitHub URLs, and check-docs-site-links.mjs only walks the emitted
# dist and skips absolute URLs. Nothing under them can reach the artifact, so
# building for them is pure cost. Both lists must stay in sync, and the
# negations must stay in step with `srcExclude` — the workflow contract check
# below enforces both. No `branches` filter on `pull_request`: stacked PRs
# target their parent branch, not main, and would otherwise skip this gate.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "!docs/plans/**"
      - "!docs/incidents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-install-asset.mjs"
      - "scripts/get"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "!docs/plans/**"
      - "!docs/incidents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-install-asset.mjs"
      - "scripts/get"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Build (dead-link gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so VitePress lastUpdated timestamps are real.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: pnpm

      - name: Validate docs workflow contract
        run: node scripts/check-docs-workflow-contract.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Deploys only from main, and only once the repository variable
    # DOCS_DEPLOY_ENABLED is set to "true" alongside the two Cloudflare
    # secrets. Until then this job skips cleanly and the workflow stays green.
    if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=jobctrl-docs --branch=main
