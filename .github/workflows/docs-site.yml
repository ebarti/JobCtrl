name: Docs Site

# Push filters exclude documents outside the built site. Pull requests always
# run the build because branch protection requires its exact-head result.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "apps/web/src/styles/tokens.css"
      - "!docs/plans/**"
      - "!docs/incidents/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-install-asset.mjs"
      - "scripts/check-docs-site-links.mjs"
      - "scripts/check-docs-site-redirects.mjs"
      - "scripts/check-docs-site-runtime.mjs"
      - "scripts/get"
      - ".github/workflows/docs-site.yml"
  # Required branch checks must exist for every PR, including docs-only changes.
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified artifact after a successful build
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (dead-link gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so VitePress lastUpdated timestamps are real.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build docs site
        run: corepack pnpm docs:build

      - name: Install Playwright Chromium
        run: corepack pnpm --filter @jobctrl/web exec playwright install --with-deps chromium

      - name: Check rendered docs site
        run: corepack pnpm docs:check:runtime

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Deploys only from main, and only once the repository variable
    # DOCS_DEPLOY_ENABLED is set to "true" alongside the two Cloudflare
    # secrets. Until then this job skips cleanly and the workflow stays green.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DOCS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site-dist
          path: docs/.vitepress/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=jobctrl-docs --branch=main
