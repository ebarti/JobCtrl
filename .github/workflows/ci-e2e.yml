name: Complete application journeys
'on':
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shards:
    name: Journeys (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UV_PYTHON: '3.12'
      UV_LOCKED: '1'
    steps:
      - name: Start total preparation timing and runtime paths
        run: |
          date +%s > "$RUNNER_TEMP/jobctrl-e2e-start"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch the fixed predecessor for the real workspace upgrade journey
        run: git fetch --no-tags --depth=1 origin 8ab86e9232d66fff9795906e061d208e7a057d8b
      - name: Fetch the fixed predecessor for the real catalog consolidation journey
        run: git fetch --no-tags --depth=1 origin 5b9db7ddfa20fa2d618687da1b311e2287286679
      - name: Fetch the fixed predecessor for citation selection replay
        run: git fetch --no-tags --depth=1 origin 6e4131061fb41aab4743701084a7c74a19fa21f3
      - name: Fetch the fixed predecessor for required normalization slots
        run: git fetch --no-tags --depth=1 origin 943c8b4d0c6f4a15521e10c04a015de726bfcbb9
      - name: Fetch the fixed predecessor for terminal-root normalization replay
        run: git fetch --no-tags --depth=1 origin 5d3fda5352fe4418332b989c05f710e0529f578c
      - name: Fetch the fixed predecessor for finite source request replay
        run: git fetch --no-tags --depth=1 origin 6f46b0ba5913383b7c57ffcce986729fa0bdbf0e
      - name: Fetch the fixed predecessor for Requirements v5 and Fit v4 authority replay
        run: git fetch --no-tags --depth=1 origin df06b08ae201f7a73dc2c359944c06daf517c69e
      - name: Fetch the fixed predecessor for Fit impact and scoped qualification call recovery
        run: git fetch --no-tags --depth=1 origin b49dc52e3d727356870317069304ac6ceb9f1237
      - name: Fetch the fixed predecessor for serial preparation recovery
        run: git fetch --no-tags --depth=1 origin 38ef94613ebb7c0413d8d5ee89987ef860f53b13
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
      - name: Install the exact dependency graphs once
        run: |
          corepack pnpm install --frozen-lockfile
          uv --project workers/automation sync --locked --all-extras
      - name: Install the verified real Temporal server
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/temporal.tar.gz"
          executable_dir="$RUNNER_TEMP/temporal"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            --output "$archive" https://github.com/temporalio/cli/releases/download/v1.7.3/temporal_cli_1.7.3_linux_amd64.tar.gz
          printf '%s  %s\n' 32a4320080342bccab37633b8777f548aa0b413c3d37fdbc7cb9d861c5fa11d0 "$archive" | sha256sum --check
          mkdir -p "$executable_dir"
          tar -xOf "$archive" temporal > "$executable_dir/temporal"
          chmod 700 "$executable_dir/temporal"
          echo "JOBCTRL_TEMPORAL_CLI_PATH=$executable_dir/temporal" >> "$GITHUB_ENV"
      - name: Prepare real browser and PDF tools
        timeout-minutes: 8
        run: |
          bash scripts/ci-apt-timeouts.sh
          corepack pnpm --filter @jobctrl/web exec playwright install --with-deps chromium
          uv --project workers/automation run --locked --all-extras playwright install chromium
          sudo apt-get install --yes poppler-utils
      - name: Record setup and declared runner resources
        run: |
          node --input-type=module <<'NODE'
          import os from 'node:os';
          import fs from 'node:fs';
          const start = Number(fs.readFileSync(process.env.RUNNER_TEMP + '/jobctrl-e2e-start', 'utf8'));
          console.log(JSON.stringify({runner:'ubuntu-24.04',arch:process.arch,cpus:os.availableParallelism(),memoryMiB:Math.round(os.totalmem()/1024/1024),setupSeconds:Math.floor(Date.now()/1000)-start,node:process.version}));
          NODE
      - name: Build once and run this shard of real application journeys
        # Reserve two minutes beyond the suite ceiling for build and owned cleanup.
        timeout-minutes: 14
        run: corepack pnpm e2e -- --shard=${{ matrix.shard }}/4 --workers=2
      - name: Require unchanged dependency locks
        if: always()
        run: git diff --exit-code -- pnpm-lock.yaml workers/automation/uv.lock
      - name: Report total job time including setup
        if: always()
        run: |
          started="$(cat "$RUNNER_TEMP/jobctrl-e2e-start")"
          echo "Complete E2E job including setup: $(( $(date +%s) - started )) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded synthetic journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-application-journeys-shard-${{ matrix.shard }}-of-4-${{ github.run_attempt }}
          path: |
            /tmp/jobctrl-transform-1428/e2e-*/timings.json
            /tmp/jobctrl-transform-1428/e2e-*/junit.xml
            /tmp/jobctrl-transform-1428/e2e-*/results.json
            /tmp/jobctrl-transform-1428/e2e-*/playwright/
            /tmp/jobctrl-transform-1428/e2e-*/application-*/api*.log
            /tmp/jobctrl-transform-1428/e2e-*/application-*/worker-*.log
            /tmp/jobctrl-transform-1428/e2e-*/temporal-*/temporal.log
          retention-days: 7
          if-no-files-found: warn
  journeys:
    name: UI checks
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all journey shards to pass
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: test "$SHARDS_RESULT" = success
