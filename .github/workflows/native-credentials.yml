name: Native credential qualification
'on':
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  credentials:
    name: Native credentials (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            context: macos-latest
          - os: windows-2025
            context: windows-latest
          - os: ubuntu-24.04
            context: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      UV_PYTHON: '3.12'
      UV_EXCLUDE_NEWER: 'false'
      UV_LOCKED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: native-${{ matrix.os }}
      - name: Prepare the exact core runtime without provider SDK groups
        run: uv --project workers/automation sync --locked --no-default-groups --no-dev
      - name: Prepare an owned Linux Secret Service session
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          bash scripts/ci-apt-timeouts.sh
          sudo apt-get update
          sudo apt-get install --yes dbus libsecret-tools gnome-keyring
      - name: Exercise controlled helper failures and actual process custody
        run: uv --project workers/automation run --locked --no-default-groups --no-dev python scripts/qa/native-credentials-e2e.py
      - name: Exercise real Linux HTTP and disposable native credentials
        if: runner.os == 'Linux'
        run: dbus-run-session -- uv --project workers/automation run --locked --no-default-groups --no-dev python scripts/qa/native-credentials-e2e.py --platform-native --linux-session
      - name: Exercise real macOS or Windows HTTP and disposable native credentials
        if: runner.os != 'Linux'
        run: uv --project workers/automation run --locked --no-default-groups --no-dev python scripts/qa/native-credentials-e2e.py --platform-native
      - name: Require unchanged dependency locks
        if: always()
        run: git diff --exit-code -- workers/automation/uv.lock
