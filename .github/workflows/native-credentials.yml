name: Native credentials
'on':
  workflow_dispatch:
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  credentials-macos:
    if: "${{ github.event_name == 'workflow_dispatch' || inputs.enabled }}"
    name: Native credentials (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.21.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: python
      with:
        python-version: '3.12'
    - name: Install adapter test dependencies
      run: |
        corepack pnpm install --frozen-lockfile --ignore-scripts
        corepack pnpm --filter @jobctrl/api rebuild better-sqlite3
        python -m pip install python-dotenv==1.2.2
    - name: Verify native credential CI contract
      if: runner.os == 'Linux'
      run: node --test scripts/native-credentials-workflow.test.mjs
    - name: Exercise fake credential batch ownership
      env:
        JOBCTRL_PYTHON_EXECUTABLE: "${{ steps.python.outputs.python-path }}"
      run: corepack pnpm --filter @jobctrl/api exec vitest run test/credential-mutation-lock.test.ts
        -t "serializes independent stores before rollback and keeps the newer successful
        value" --maxWorkers=1
    - name: Install Linux Secret Service
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y dbus libsecret-tools gnome-keyring
    - name: Exercise native Linux adapter in owned D-Bus session
      if: runner.os == 'Linux'
      run: dbus-run-session -- python scripts/native-credentials-host.py --linux-session
    - name: Exercise native Windows or macOS adapter
      if: runner.os != 'Linux'
      run: python scripts/native-credentials-host.py
  credentials-windows:
    if: "${{ github.event_name == 'workflow_dispatch' || inputs.enabled }}"
    name: Native credentials (windows-latest)
    runs-on: windows-latest
