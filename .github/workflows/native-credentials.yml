name: Native credential stores

on:
  pull_request:
    paths:
      - "apps/api/src/credentials.ts"
      - "apps/api/src/credential-mutation-lock.ts"
      - "apps/api/src/credential-process-identity.ts"
      - "apps/api/src/native-credential-store.ts"
      - "apps/api/src/config-file.ts"
      - "apps/api/src/config.ts"
      - "apps/api/src/contracts.ts"
      - "apps/api/test/*credential*.ts"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "packages/contracts/**"
      - "packages/domain-types/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "workers/automation/src/jobctrl/native_credentials.py"
      - "scripts/native-credentials-host.py"
      - "scripts/test_native_credentials_host.py"
      - "scripts/native-credentials-workflow.test.mjs"
      - ".github/workflows/native-credentials.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12"
      - name: Install adapter test dependencies
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @jobctrl/api rebuild better-sqlite3
          python -m pip install python-dotenv==1.2.2
      - name: Verify native credential CI contract
        if: runner.os == 'Linux'
        run: node --test scripts/native-credentials-workflow.test.mjs
      - name: Verify secret-free native harness diagnostics
        run: python scripts/test_native_credentials_host.py
      - name: Exercise fake credential batch ownership
        env:
          JOBCTRL_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: >-
          corepack pnpm --filter @jobctrl/api exec vitest run
          test/credential-mutation-lock.test.ts
          -t "serializes independent stores before rollback and keeps the newer successful value"
          --maxWorkers=1
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus libsecret-tools gnome-keyring
      - name: Exercise native Linux adapter in owned D-Bus session
        if: runner.os == 'Linux'
        run: dbus-run-session -- python scripts/native-credentials-host.py --linux-session
      - name: Exercise native Windows or macOS adapter
        if: runner.os != 'Linux'
        run: python scripts/native-credentials-host.py
