  credentials-ubuntu:
    if: "${{ github.event_name == 'workflow_dispatch' || inputs.enabled }}"
    name: Native credentials (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
