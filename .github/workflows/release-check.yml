name: Release Privacy Gate

# This is the privacy gate for a public repository: any file anywhere can carry
# owner PII or a secret, so `pull_request` deliberately takes no `paths` filter.
# It takes no `branches` filter either — stacked pull requests target their
# parent branch rather than main, and restricting to main skipped the scan on
# every stacked layer. `push` stays scoped to main, where it backstops the
# merged result.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: release-check

      - name: Sync locked privacy-gate tools
        run: uv --project workers/automation sync --locked --only-group release-check

      - name: Run release check
        run: uv --project workers/automation run --locked --only-group release-check python scripts/release_check.py --strict-prompt

      - name: Run release check self-test
        run: uv --project workers/automation run --locked --only-group release-check pytest -q -c /dev/null -p no:cacheprovider --noconftest workers/automation/tests/test_release_check.py
