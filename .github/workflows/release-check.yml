name: Release Privacy Gate

# PR privacy and scope admission live in pr-ci.yml; main/manual scans stay here.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: workers/automation/uv.lock
          cache-suffix: release-check

      - name: Sync locked privacy-gate tools
        run: uv --project workers/automation sync --locked --only-group release-check

      - name: Run release check
        run: uv --project workers/automation run --locked --only-group release-check python scripts/release_check.py --strict-prompt

      - name: Run release check self-test
        run: uv --project workers/automation run --locked --only-group release-check pytest -q -c /dev/null -p no:cacheprovider --noconftest workers/automation/tests/test_release_check.py
